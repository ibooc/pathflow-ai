<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found — PathFlow AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0a0a1a 0%, #1a0a2e 50%, #0a1628 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }
        .container {
            text-align: center;
            padding: 40px 20px;
            max-width: 500px;
        }
        .icon-box {
            width: 100px;
            height: 100px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 32px;
            font-size: 2.5rem;
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        .error-code {
            font-size: 5rem;
            font-weight: 800;
            background: linear-gradient(135deg, #667eea, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1;
            margin-bottom: 16px;
        }
        h1 {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 12px;
        }
        p {
            color: rgba(255,255,255,0.6);
            font-size: 1rem;
            line-height: 1.6;
            margin-bottom: 32px;
        }
        .links {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .btn {
            display: inline-block;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 14px 28px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102,126,234,0.4);
            color: white;
        }
        .btn-outline {
            background: transparent;
            border: 2px solid rgba(102,126,234,0.5);
            color: white;
        }
        .btn-outline:hover {
            border-color: #667eea;
            background: rgba(102,126,234,0.1);
        }
        .logo {
            position: fixed;
            top: 24px;
            left: 24px;
            font-size: 1.3rem;
            font-weight: 800;
            background: linear-gradient(135deg, #667eea, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <a href="/" class="logo">
        <i class="fas fa-route" style="-webkit-text-fill-color: #667eea;"></i>
        PathFlow AI
    </a>

    <div class="container">
        <div class="icon-box">
            <i class="fas fa-map-signs"></i>
        </div>

        <div class="error-code">404</div>
        <h1>Page Nahi Mila! 🗺️</h1>
        <p>
            Ye page exist nahi karta ya delete ho gaya hai.<br>
            Shayad URL galat type hua hai!
        </p>

        <div class="links">
            <a href="/" class="btn">
                <i class="fas fa-home me-2"></i>Home
            </a>
            <a href="/dashboard" class="btn btn-outline">
                <i class="fas fa-chart-line me-2"></i>Dashboard
            </a>
        </div>
    </div>
</body>
</html>
