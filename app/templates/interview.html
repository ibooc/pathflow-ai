<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interview Prep — PathFlow AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
    <style>
        .interview-hero {
            background: linear-gradient(135deg, #0a0a1a 0%, #1a0a2e 50%, #0a1628 100%);
            min-height: 100vh;
            padding-top: 100px;
        }
        .interview-card {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 24px;
            padding: 40px;
            backdrop-filter: blur(20px);
        }
        .role-input {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 12px;
            padding: 14px 16px;
            color: white;
            width: 100%;
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
        }
        .role-input:focus {
            outline: none;
            border-color: #667eea;
            background: rgba(102,126,234,0.1);
        }
        .role-input::placeholder { color: rgba(255,255,255,0.3); }
        .section-label {
            color: #a78bfa;
            font-weight: 700;
            font-size: 1rem;
            margin: 16px 0 8px;
            display: block;
        }
        .suggest-tag {
            display: inline-block;
            background: rgba(102,126,234,0.15);
            border: 1px solid rgba(102,126,234,0.3);
            color: #a78bfa;
            padding: 5px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            cursor: pointer;
            margin: 3px;
            transition: all 0.2s;
        }
        .suggest-tag:hover {
            background: rgba(102,126,234,0.3);
            transform: translateY(-1px);
        }
        .result-box {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(102,126,234,0.3);
            border-radius: 16px;
            padding: 28px;
            margin-top: 24px;
            display: none;
        }
        .q-card {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 16px;
            transition: all 0.3s;
        }
        .q-card:hover {
            border-color: rgba(102,126,234,0.4);
            background: rgba(102,126,234,0.08);
        }
        .q-label {
            color: #667eea;
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }
        .q-text {
            color: white;
            font-weight: 600;
            font-size: 1rem;
            margin-bottom: 12px;
        }
        .a-text {
            color: rgba(255,255,255,0.7);
            font-size: 0.9rem;
            line-height: 1.7;
            border-left: 3px solid #667eea;
            padding-left: 12px;
        }
        .hr-badge {
            background: rgba(46,213,115,0.2);
            border: 1px solid rgba(46,213,115,0.4);
            color: #2ed573;
            padding: 3px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        .tech-badge {
            background: rgba(102,126,234,0.2);
            border: 1px solid rgba(102,126,234,0.4);
            color: #a78bfa;
            padding: 3px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        .tip-box {
            background: rgba(255,193,7,0.1);
            border: 1px solid rgba(255,193,7,0.3);
            border-radius: 12px;
            padding: 16px 20px;
            margin-top: 16px;
        }
        .tip-box i { color: #ffc107; }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark fixed-top" id="mainNavbar">
        <div class="container">
            <a class="navbar-brand fw-bold fs-4" href="/">
    <img src="{{ url_for('static', filename='images/logo1.png') }}"
    style="height: 50px; width: 50px; margin-left: auto; vertical-align: middle;">
    <strong style="font-weight: 1500; margin-right: 8px;">PathFlow.in</strong>
</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto gap-2">
                    <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="/resume-scanner">Resume Scanner</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <section class="interview-hero">
        <div class="container">

            <!-- Header -->
            <div class="text-center mb-5">
                <div class="badge-pill mb-3">
                    <i class="fas fa-comments me-2"></i>AI Interview Prep
                </div>
                <h1 class="hero-title">Interview <span class="gradient-text">Generator</span></h1>
                <p class="hero-subtitle mx-auto mt-3">
                    Apna target role batao — AI technical aur HR questions generate karega with answers!
                </p>
            </div>

            <div class="row justify-content-center">
                <div class="col-lg-8">
                    <div class="interview-card">

                        <!-- Role Input -->
                        <div class="mb-4">
                            <label class="section-label">
                                <i class="fas fa-briefcase me-2"></i>Kaunse Role Ka Interview Chahiye?
                            </label>
                            <input type="text" class="role-input" id="roleInput"
                                placeholder="e.g. Python Developer, Data Analyst, AI Engineer...">
                            <div class="mt-2">
                                <small style="color: rgba(255,255,255,0.4);">Popular roles:</small><br>
                                <span class="suggest-tag" onclick="fillRole('Web Developer')">Web Developer</span>
                                <span class="suggest-tag" onclick="fillRole('Python Developer')">Python Developer</span>
                                <span class="suggest-tag" onclick="fillRole('Data Analyst')">Data Analyst</span>
                                <span class="suggest-tag" onclick="fillRole('AI Engineer')">AI Engineer</span>
                                <span class="suggest-tag" onclick="fillRole('Full Stack Developer')">Full Stack Developer</span>
                                <span class="suggest-tag" onclick="fillRole('DevOps Engineer')">DevOps Engineer</span>
                                <span class="suggest-tag" onclick="fillRole('UI/UX Designer')">UI/UX Designer</span>
                            </div>
                        </div>

                        <!-- Generate Button -->
                        <button class="btn-analyze" id="generateBtn" onclick="generateInterview()">
                            <i class="fas fa-magic me-2"></i>Generate Interview Questions
                        </button>

                        <!-- Result -->
                        <div class="result-box" id="resultBox">
                            <div id="questionsContent"></div>
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function fillRole(role) {
            document.getElementById('roleInput').value = role;
        }

        async function generateInterview() {
            const role = document.getElementById('roleInput').value.trim();

            if (!role) {
                alert('Pehle role likho!');
                return;
            }

            const btn = document.getElementById('generateBtn');
            btn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i>AI Generating Questions...';
            btn.disabled = true;

            try {
                const response = await fetch('/generate-interview', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ role })
                });

                const data = await response.json();

                if (data.questions) {
                    showQuestions(role, data.questions);
                } else {
                    alert('Error: ' + data.error);
                }
            } catch (err) {
                alert('Server error!');
            } finally {
                btn.innerHTML = '<i class="fas fa-magic me-2"></i>Generate Interview Questions';
                btn.disabled = false;
            }
        }

        function showQuestions(role, raw) {
    let html = `<h4 style="color:#a78bfa; margin-bottom:20px;">
        <i class="fas fa-comments me-2"></i>${role} Interview Questions
    </h4>`;

    const lines = raw.split('\n');
    let currentSection = '';
    let currentQ = '';
    let currentA = '';

    function flushCard() {
        if (!currentQ) return;
        const isHR = currentSection === 'hr';
        html += `
            <div class="q-card">
                <div class="q-label">
                    ${isHR
                        ? '<span class="hr-badge">HR</span>'
                        : '<span class="tech-badge">Technical</span>'
                    }
                </div>
                <div class="q-text">${currentQ}</div>
                ${currentA ? `<div class="a-text"><strong>Answer:</strong> ${currentA}</div>` : ''}
            </div>`;
        currentQ = '';
        currentA = '';
    }

    lines.forEach(line => {
        line = line.trim();
        if (!line) return;

        // Remove markdown bold
        line = line.replace(/\*\*(.*?)\*\*/g, '$1');

        // Section headers
        if (line.match(/TECHNICAL QUESTIONS/i)) {
            flushCard();
            currentSection = 'technical';
            html += `<div class="section-label" style="color:#a78bfa; font-weight:700; margin:16px 0 8px;">
                <i class="fas fa-code me-2"></i>Technical Questions</div>`;
            return;
        }
        if (line.match(/HR QUESTIONS/i)) {
            flushCard();
            currentSection = 'hr';
            html += `<div class="section-label" style="color:#2ed573; font-weight:700; margin:16px 0 8px;">
                <i class="fas fa-user me-2"></i>HR Questions</div>`;
            return;
        }
        if (line.match(/INTERVIEW TIPS/i)) {
            flushCard();
            currentSection = 'tips';
            html += `<div class="section-label" style="color:#ffc107; font-weight:700; margin:16px 0 8px;">
                <i class="fas fa-lightbulb me-2"></i>Interview Tips</div>`;
            return;
        }

        // Questions — Q1: ya **Q1:** ya numbered
        if (line.match(/^Q\d+[\.:]/i) || line.match(/^\*\*Q\d+/i)) {
            flushCard();
            currentQ = line.replace(/^(\*\*)?Q\d+[\.:]\*?\*?\s*/i, '').trim();
            return;
        }

        // Answers — A1: ya **A1:**
        if (line.match(/^A\d+[\.:]/i) || line.match(/^\*\*A\d+/i)) {
            currentA = line.replace(/^(\*\*)?A\d+[\.:]\*?\*?\s*/i, '').trim();
            return;
        }

        // Tips section
        if (currentSection === 'tips') {
            const tip = line.replace(/^[-*\d.]+\s*/, '').trim();
            if (tip) {
                html += `<div style="background:rgba(255,193,7,0.08); border:1px solid rgba(255,193,7,0.2);
                    border-radius:8px; padding:10px 14px; margin-bottom:8px;
                    color:rgba(255,255,255,0.8); font-size:0.88rem;">
                    <i class="fas fa-star me-2" style="color:#ffc107;"></i>${tip}
                </div>`;
            }
            return;
        }

        // Continuation of answer
        if (currentA && currentSection !== 'tips') {
            currentA += ' ' + line;
        } else if (currentQ && !currentA) {
            currentA += line;
        }
    });

    // Last card flush
    flushCard();

    document.getElementById('questionsContent').innerHTML = html;
    document.getElementById('resultBox').style.display = 'block';
    document.getElementById('resultBox').scrollIntoView({ behavior: 'smooth' });
}

        function buildQCard(q, a, isHR) {
            return `
                <div class="q-card">
                    <div class="q-label">
                        ${isHR
                            ? '<span class="hr-badge">HR</span>'
                            : '<span class="tech-badge">Technical</span>'
                        }
                    </div>
                    <div class="q-text">${q}</div>
                    ${a ? `<div class="a-text"><strong>Answer:</strong> ${a}</div>` : ''}
                </div>
            `;
        }
    </script>
</body>
</html>
