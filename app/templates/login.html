<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — PathFlow AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #0a0a1a 0%, #1a0a2e 50%, #0a1628 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .auth-card {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 24px;
            padding: 40px;
            width: 100%;
            max-width: 420px;
            backdrop-filter: blur(20px);
        }
        .auth-input {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 12px;
            padding: 14px 16px;
            color: white;
            width: 100%;
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
            margin-bottom: 16px;
        }
        .auth-input:focus {
            outline: none;
            border-color: #667eea;
            background: rgba(102,126,234,0.1);
        }
        .auth-input::placeholder { color: rgba(255,255,255,0.3); }
        .auth-label {
            color: rgba(255,255,255,0.6);
            font-size: 0.85rem;
            margin-bottom: 6px;
            display: block;
        }
        .error-msg {
            background: rgba(231,76,60,0.2);
            border: 1px solid rgba(231,76,60,0.4);
            color: #e74c3c;
            padding: 10px 16px;
            border-radius: 10px;
            font-size: 0.85rem;
            margin-bottom: 16px;
        }
    </style>
</head>
<body>
    <div class="auth-card">
        <div class="text-center mb-1">
    <div class="d-flex align-items-center justify-content-center mb-1" style="margin-right: 15px;">
        <img src="{{ url_for('static', filename='images/logo1.png') }}"
        style="height: 50px; width: auto; margin-right: 4px; vertical-align: middle;">
        <h3 style="background: linear-gradient(135deg, #667eea, #a78bfa);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            font-weight: 1000; margin: 0;">PathFlow.in
        </h3>
    </div>
    <p style="color: rgba(255,255,255,0.5); font-size:0.9rem;">
        Welcome back! Login karo
    </p>
</div>
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="error-msg">
                        <i class="fas fa-exclamation-circle me-2"></i>{{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST" action="/login">
            <div>
                <label class="auth-label">Email Address</label>
                <input type="email" name="email" class="auth-input"
                    placeholder="tumhari@email.com" required>
            </div>
            <div>
                <label class="auth-label">Password</label>
                <input type="password" name="password" class="auth-input"
                    placeholder="Password" required>
            </div>

            <button type="submit" class="btn-analyze" style="margin-top:8px;">
                <i class="fas fa-sign-in-alt me-2"></i>Login
            </button>
        </form>

        <div class="text-center mt-3">
            <p style="color:rgba(255,255,255,0.4); font-size:0.85rem;">
                Naya account chahiye?
                <a href="/register" style="color:#a78bfa; text-decoration:none; font-weight:600;">
                    Register karo
                </a>
            </p>
        </div>
    </div>
</body>
</html>
